# 插件市场的打包入口：`dsh plugin add github:chenjrastro-tech/github-release-download-acceleration`
# 会读本文件，把这条 loader entry 插进 profile 树。
#
# 两条硬规则（与 dsh-fact-check 相同）：
#   · `id` 是 Cordis 插件 id，必须等于 index.js 的 `export const name`；
#   · `name` 是包名，必须与 package.json 的 `name` 完全一致，否则开机解析会失败。
#
# 本插件没有可覆写配置：它只把包自带的 SKILL.md 挂进技能目录。技能自己的阈值
# （min_size_for_ladder_mb / single_conn_fast_kbps）写在 SKILL.md 的 frontmatter 里，
# 主机相关的代理端口、镜像列表全部由技能在运行时自检，不进这里。
- insert:
    - id: github-release-download-acceleration
      name: 'github-release-download-acceleration'
